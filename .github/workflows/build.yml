name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Derle (Release)
        run: dotnet build VeriKurtarmaMerkezi.sln -c Release --nologo
      - name: Yayinla (self-contained x64, hazir exe)
        run: dotnet publish VKM.App/VKM.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish --nologo
      - name: Paketle (zip)
        run: Compress-Archive -Path publish/* -DestinationPath VKM-hazir.zip -Force
      - name: Yukle (indirilebilir hazir exe)
        uses: actions/upload-artifact@v4
        with:
          name: VKM-hazir-exe
          path: VKM-hazir.zip
          retention-days: 30
